spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_werewolf?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: change_me
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2s
      repositories:
        enabled: false

llm:
  provider: mock
  open-ai-compatible:
    api-key:
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout-seconds: 30
  bailian:
    api-key:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    timeout-seconds: 30
  deepseek:
    api-key:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-seconds: 30
  zhipu:
    api-key:
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-flash
    timeout-seconds: 30

ai-infra:
  agent-worker:
    pool-size: 4
    max-pool-size: 8
    queue-capacity: 128
    await-timeout-seconds: 60

logging:
  level:
    com.example.aiwerewolf: DEBUG
