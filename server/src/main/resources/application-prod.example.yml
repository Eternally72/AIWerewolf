spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

llm:
  provider: ${LLM_PROVIDER:mock}
  open-ai-compatible:
    api-key: ${OPENAI_COMPATIBLE_API_KEY:}
    base-url: ${OPENAI_COMPATIBLE_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_COMPATIBLE_MODEL:gpt-4o-mini}
    timeout-seconds: ${OPENAI_COMPATIBLE_TIMEOUT_SECONDS:30}
  bailian:
    api-key: ${BAILIAN_API_KEY:}
    base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${BAILIAN_MODEL:qwen-plus}
    timeout-seconds: ${BAILIAN_TIMEOUT_SECONDS:30}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    model: ${ZHIPU_MODEL:glm-4-flash}
    timeout-seconds: ${ZHIPU_TIMEOUT_SECONDS:30}

ai-infra:
  agent-worker:
    pool-size: ${AGENT_WORKER_POOL_SIZE:4}
    max-pool-size: ${AGENT_WORKER_MAX_POOL_SIZE:8}
    queue-capacity: ${AGENT_WORKER_QUEUE_CAPACITY:128}
    await-timeout-seconds: ${AGENT_WORKER_AWAIT_TIMEOUT_SECONDS:60}

logging:
  level:
    com.example.aiwerewolf: INFO
