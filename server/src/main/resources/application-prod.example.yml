spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

llm:
  provider: ${LLM_PROVIDER:mock}
  bailian:
    api-key: ${BAILIAN_API_KEY:}
    base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${BAILIAN_MODEL:qwen-plus}

logging:
  level:
    com.example.aiwerewolf: INFO
